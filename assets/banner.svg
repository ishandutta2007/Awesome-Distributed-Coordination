<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#080c14" />
    </linearGradient>

    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.6" />
    </linearGradient>

    <linearGradient id="pillGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Filter for Glow Effects -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .bg-grid { stroke: rgba(255, 255, 255, 0.04); stroke-width: 1; }
    .node-pulse {
      animation: pulseAnim 3s infinite ease-in-out;
    }
    .node-pulse-delayed {
      animation: pulseAnim 3s infinite ease-in-out;
      animation-delay: 1.5s;
    }
    .packet-move-1 {
      animation: packet1 4s linear infinite;
    }
    .packet-move-2 {
      animation: packet2 5s linear infinite;
    }
    .packet-move-3 {
      animation: packet3 6s linear infinite;
    }
    .ring-spin {
      transform-origin: 600px 180px;
      animation: spin 30s linear infinite;
    }
    .ring-spin-reverse {
      transform-origin: 600px 180px;
      animation: spinReverse 40s linear infinite;
    }
    .float-pill {
      animation: float 4s ease-in-out infinite;
    }
    .float-pill-reverse {
      animation: floatReverse 4.5s ease-in-out infinite;
    }

    @keyframes pulseAnim {
      0%, 100% { transform: scale(1); opacity: 0.6; }
      50% { transform: scale(1.15); opacity: 1; }
    }
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes spinReverse {
      from { transform: rotate(360deg); }
      to { transform: rotate(0deg); }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }
    @keyframes floatReverse {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(6px); }
    }
    @keyframes packet1 {
      0% { offset-distance: 0%; opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { offset-distance: 100%; opacity: 0; }
    }
  </style>

  <!-- Deep Cosmic Canvas -->
  <rect width="1200" height="360" fill="url(#bgGrad)" rx="16" />

  <!-- Subtle Coordinate Grid Background -->
  <g class="bg-grid">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="200" y1="0" x2="200" y2="360" />
    <line x1="400" y1="0" x2="400" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="800" y1="0" x2="800" y2="360" />
    <line x1="1000" y1="0" x2="1000" y2="360" />
  </g>

  <!-- Dynamic / Animated Distributed Cluster Mesh (In Background) -->
  <g opacity="0.35">
    <!-- Orbital Rings representing consensus quorum -->
    <circle class="ring-spin" cx="600" cy="180" r="160" fill="none" stroke="url(#glowGrad)" stroke-width="1.5" stroke-dasharray="10 20" />
    <circle class="ring-spin-reverse" cx="600" cy="180" r="230" fill="none" stroke="#8b5cf6" stroke-width="1" stroke-dasharray="6 14" opacity="0.5" />
    
    <!-- Distributed Topology Nodes -->
    <!-- Left Cluster -->
    <line x1="120" y1="90" x2="240" y2="160" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4 4" />
    <line x1="240" y1="160" x2="160" y2="270" stroke="#8b5cf6" stroke-width="1.5" />
    <line x1="160" y1="270" x2="120" y2="90" stroke="#ec4899" stroke-width="1.5" stroke-dasharray="5 5" />
    <line x1="240" y1="160" x2="380" y2="130" stroke="#3b82f6" stroke-width="1" stroke-dasharray="3 3" />
    
    <!-- Right Cluster -->
    <line x1="960" y1="100" x2="1080" y2="180" stroke="#ec4899" stroke-width="1.5" stroke-dasharray="4 4" />
    <line x1="1080" y1="180" x2="990" y2="280" stroke="#8b5cf6" stroke-width="1.5" />
    <line x1="990" y1="280" x2="960" y2="100" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="5 5" />
    <line x1="820" y1="220" x2="990" y2="280" stroke="#8b5cf6" stroke-width="1" stroke-dasharray="3 3" />

    <!-- Quorum Central Links -->
    <line x1="240" y1="160" x2="600" y2="180" stroke="#3b82f6" stroke-width="1" opacity="0.4" />
    <line x1="960" y1="100" x2="600" y2="180" stroke="#ec4899" stroke-width="1" opacity="0.4" />
    <line x1="160" y1="270" x2="600" y2="180" stroke="#8b5cf6" stroke-width="1" opacity="0.4" />
    <line x1="1080" y1="180" x2="600" y2="180" stroke="#8b5cf6" stroke-width="1" opacity="0.4" />

    <!-- Dynamic Pulsing Nodes -->
    <circle cx="120" cy="90" r="7" fill="#60a5fa" filter="url(#glow)" />
    <circle cx="240" cy="160" r="9" fill="#a855f7" filter="url(#glow)" class="node-pulse" />
    <circle cx="160" cy="270" r="6" fill="#ec4899" />
    <circle cx="380" cy="130" r="5" fill="#38bdf8" />

    <circle cx="960" cy="100" r="8" fill="#ec4899" filter="url(#glow)" class="node-pulse-delayed" />
    <circle cx="1080" cy="180" r="9" fill="#8b5cf6" filter="url(#glow)" />
    <circle cx="990" cy="280" r="7" fill="#3b82f6" />
    <circle cx="820" cy="220" r="5" fill="#c084fc" />

    <!-- Animated Data Stream Packets -->
    <circle cx="180" cy="125" r="3.5" fill="#ffffff" filter="url(#softGlow)">
      <animate attributeName="cx" values="120;240;120" dur="4s" repeatCount="indefinite" />
      <animate attributeName="cy" values="90;160;90" dur="4s" repeatCount="indefinite" />
    </circle>
    <circle cx="1020" cy="140" r="3.5" fill="#ffffff" filter="url(#softGlow)">
      <animate attributeName="cx" values="960;1080;960" dur="3.5s" repeatCount="indefinite" />
      <animate attributeName="cy" values="100;180;100" dur="3.5s" repeatCount="indefinite" />
    </circle>
    <circle cx="600" cy="180" r="4" fill="#38bdf8" filter="url(#glow)">
      <animate attributeName="r" values="3;7;3" dur="2.5s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2.5s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Ambient Light Backdrops (behind text) -->
  <circle cx="600" cy="140" r="280" fill="#3b82f6" opacity="0.12" filter="url(#glow)" />
  <circle cx="600" cy="220" r="200" fill="#a855f7" opacity="0.12" filter="url(#glow)" />

  <!-- Foreground Pill Badges (Positioned cleanly to flank/support title without obstruction) -->
  <g class="float-pill">
    <!-- Left Pill: Raft & Paxos Consensus -->
    <rect x="70" y="32" width="220" height="38" rx="19" fill="url(#pillGrad1)" stroke="#3b82f6" stroke-width="1.2" opacity="0.9" />
    <circle cx="92" cy="51" r="5" fill="#38bdf8" />
    <text x="108" y="56" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" letter-spacing="0.5">⚡ Consensus Protocols</text>
  </g>

  <g class="float-pill-reverse">
    <!-- Right Pill: Service Discovery & Config -->
    <rect x="910" y="32" width="220" height="38" rx="19" fill="url(#pillGrad1)" stroke="#a855f7" stroke-width="1.2" opacity="0.9" />
    <circle cx="932" cy="51" r="5" fill="#c084fc" />
    <text x="948" y="56" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" letter-spacing="0.5">🌐 Service Discovery</text>
  </g>

  <!-- FOREGROUND: Crystal-Clear Title and Subtitle -->
  <g>
    <!-- Top Super-Header Category Tag -->
    <text x="600" y="78" text-anchor="middle" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="3" text-transform="uppercase">
      CURATED ECOSYSTEM &amp; ARCHITECTURE GUIDE
    </text>

    <!-- Main Title -->
    <text x="600" y="146" text-anchor="middle" fill="url(#primaryGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5">
      Awesome Distributed Coordination
    </text>

    <!-- Subtitle: Foreground, clean, crisp -->
    <text x="600" y="196" text-anchor="middle" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="500" letter-spacing="0.2">
      Consensus Protocols • Service Discovery • Distributed Locks • Cloud Configuration
    </text>

    <!-- Tech Stack Highlights Row -->
    <g transform="translate(260, 248)">
      <!-- etcd -->
      <rect x="0" y="0" width="115" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="57.5" y="20.5" text-anchor="middle" fill="#93c5fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">etcd (Raft)</text>

      <!-- ZooKeeper -->
      <rect x="135" y="0" width="140" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="205" y="20.5" text-anchor="middle" fill="#c4b5fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">ZooKeeper (ZAB)</text>

      <!-- Consul -->
      <rect x="295" y="0" width="125" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="357.5" y="20.5" text-anchor="middle" fill="#f472b6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Consul (Mesh)</text>

      <!-- Redis & Valkey -->
      <rect x="440" y="0" width="130" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="505" y="20.5" text-anchor="middle" fill="#fdba74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Redis / Redlock</text>

      <!-- CoreDNS / Nacos -->
      <rect x="590" y="0" width="115" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="647.5" y="20.5" text-anchor="middle" fill="#86efac" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">CoreDNS / Nacos</text>
    </g>

    <!-- Bottom Accent Line -->
    <rect x="460" y="318" width="280" height="3" rx="1.5" fill="url(#primaryGrad)" />
  </g>
</svg>
